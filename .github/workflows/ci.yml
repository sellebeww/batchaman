name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm budget
      - run: pnpm audit --audit-level high
      - run: pnpm licenses list --prod --json > licenses.json
      - run: node scripts/check-licenses.mjs licenses.json
      - name: Lighthouse mobile
        run: |
          pnpm --filter @batchaman/web preview --host 127.0.0.1 > /tmp/batchaman-preview.log 2>&1 &
          pnpm dlx lighthouse@13.5.0 http://127.0.0.1:4173 --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=lighthouse.json --quiet
          node scripts/check-lighthouse.mjs lighthouse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            lighthouse.json
            licenses.json
            coverage/
            test-results/
